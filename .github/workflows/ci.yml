name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  demo:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install -U pip
          pip install -r requirements.txt

      - name: Generate synthetic bank feeds
        run: python data/generate_bank_feeds.py

      - name: Run converter (PowerCenter -> Databricks artifacts)
        run: python converter/pc2dbx_converter.py

      - name: Converter + app tests
        run: pytest -q tests/

      - name: infa2dbx convert (app)
        run: python -m infa2dbx convert --repo . --out build

      - name: Run end-to-end demo + validation
        run: python runner/run_demo.py

      - name: Verify generated module vs legacy result
        run: |
          python -m infa2dbx verify \
            --module build/module_m_load_dept_txn.py \
            --data data \
            --legacy artifacts/output/legacy/fact_daily_customer.csv

      - name: SCD2 + Change Data Feed
        run: python runner/run_scd2.py

      - name: Show conversion report
        run: cat artifacts/generated/conversion_report.md
