[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "infa2dbx"
version = "0.1.0"
description = "Informatica PowerCenter -> Databricks conversion app"
requires-python = ">=3.9"
dependencies = ["pyspark>=3.5"]

[project.optional-dependencies]
dev = ["pytest>=7.4", "pandas>=2.0", "pyarrow>=14", "delta-spark>=3.0"]

[project.scripts]
infa2dbx = "infa2dbx.cli:main"

[tool.setuptools]
packages = ["infa2dbx"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py39"
exclude = [".venv", ".git", "artifacts", "**/artifacts", "notebooks", "**/notebooks", "graphify-out"]

[tool.ruff.lint]
select = ["E", "F", "W"]
ignore = ["E402", "E501", "F841", "E702", "E741", "F541"]
